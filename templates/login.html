<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>BruteGuard</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>


<body>

    <div class="login-container">

        <h1>BruteGuard</h1>

        <p>Brute Force Detection System</p>


        <form id="loginForm"
              action="/login"
              method="POST">


            <label for="username">
                Username
            </label>

            <input
                type="text"
                id="username"
                name="username"
                placeholder="Enter username"
            >


            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter password"
            >


            <button type="submit">
                Login
            </button>


            {% if message %}

                <p id="message">
                    {{ message }}
                </p>

            {% endif %}


        </form>

    </div>


    <script src="{{ url_for('static', filename='script.js') }}"></script>

</body>

</html>
